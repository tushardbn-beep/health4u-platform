
services:
  - type: web
    name: health4u-web
    plan: free
    runtime: node
    buildCommand: npm install && npm install --prefix client && npm install --prefix server && npm run db:generate --prefix server && npm run build
    startCommand: npm run db:migrate --prefix server && npm run db:seed --prefix server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: health4u-db
          property: connectionString
      - key: JWT_SECRET 25adfd96ae9b07da2a2fb5fa78f7dcd9271790a28d1583ffc1290bb0340d3b57
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://health4u-web.onrender.com

databases:
  - name: health4u-db
    plan: free
    databaseName: health4u
    user: health4u_app
